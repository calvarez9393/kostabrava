<p-toast></p-toast>
<div class="row align-items-start g-5">
  <!-- Left: pitch copy -->
  <div class="col-md-6">
    <span class="kb-form-eyebrow">¿Listo para comenzar?</span>
    <h2 class="kb-form-title">Deja tus dotaciones en manos de especialistas</h2>
    <p class="kb-form-text">
      Respaldados por la tradición y calidad de Kosta Azul, somos la mejor opción para la
      producción de dotaciones empresariales a medida.
    </p>
  </div>

  <!-- Right: contact form -->
  <div class="col-md-6">
    <div class="kb-form-card">
      <h3 class="kb-form-card-title">Contáctanos</h3>
      <form [formGroup]="formulario" novalidate>

        <div class="kb-field">
          <label for="nombre" class="kb-label">
            Nombre completo <span class="kb-required" aria-hidden="true">*</span>
          </label>
          <input
            id="nombre"
            formControlName="nombre"
            class="form-control kb-input"
            type="text"
            placeholder="Ej: María García"
            autocomplete="name">
        </div>

        <div class="row g-3">
          <div class="col-sm-6">
            <div class="kb-field">
              <label for="correo" class="kb-label">
                Correo electrónico <span class="kb-required" aria-hidden="true">*</span>
              </label>
              <input
                id="correo"
                formControlName="correo"
                class="form-control kb-input"
                type="email"
                placeholder="nombre@empresa.com"
                autocomplete="email">
            </div>
          </div>
          <div class="col-sm-6">
            <div class="kb-field">
              <label for="telefono" class="kb-label">
                Teléfono <span class="kb-required" aria-hidden="true">*</span>
              </label>
              <input
                id="telefono"
                formControlName="telefono"
                class="form-control kb-input"
                type="tel"
                placeholder="300 000 0000"
                autocomplete="tel">
            </div>
          </div>
        </div>

        <div class="kb-field">
          <label for="empresa" class="kb-label">
            Empresa <span class="kb-required" aria-hidden="true">*</span>
          </label>
          <input
            id="empresa"
            formControlName="empresa"
            class="form-control kb-input"
            type="text"
            placeholder="Nombre de tu empresa"
            autocomplete="organization">
        </div>

        <div class="kb-field">
          <label for="mensaje" class="kb-label">
            Mensaje <span class="kb-required" aria-hidden="true">*</span>
          </label>
          <textarea
            id="mensaje"
            formControlName="mensaje"
            class="form-control kb-input kb-textarea"
            placeholder="Cuéntanos qué necesitas…"
            rows="4">
          </textarea>
        </div>

        <p class="kb-required-note"><span aria-hidden="true">*</span> Campos requeridos</p>

        <button
          type="submit"
          [disabled]="formulario.invalid"
          (click)="guardarFormulario()"
          class="kb-btn-submit">
          Enviar solicitud
        </button>
      </form>
    </div>
  </div>
</div>
