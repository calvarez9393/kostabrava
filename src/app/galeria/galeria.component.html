<div class="kb-gallery">

  <!-- Header -->
  <div class="kb-gallery-header">
    <div class="kb-gallery-brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="kb-gallery-icon"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span class="kb-gallery-badge">Kosta Brava</span>
    </div>
    <div class="kb-gallery-meta">
      <span class="kb-gallery-count">
        {{ imagenes.length }} {{ imagenes.length === 1 ? 'imagen' : 'imágenes' }}
      </span>
      <button
        class="kb-gallery-close"
        (click)="activeModal.dismiss('close')"
        aria-label="Cerrar galería">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Galleria body: flechas propias (Prime dentro del modal a veces no actualiza el slide) -->
  <div class="kb-gallery-body">
    <div class="kb-gallery-stage" *ngIf="imagenes.length > 1">
      <button
        type="button"
        class="kb-gallery-fab kb-gallery-fab-prev"
        (click)="prevSlide()"
        aria-label="Imagen anterior">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button
        type="button"
        class="kb-gallery-fab kb-gallery-fab-next"
        (click)="nextSlide()"
        aria-label="Imagen siguiente">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <p-galleria
      [value]="imagenes"
      [activeIndex]="activeIndex"
      (activeIndexChange)="onSlideChange($event)"
      [responsiveOptions]="responsiveOptions"
      [circular]="true"
      [numVisible]="5"
      [showItemNavigators]="false"
      [showThumbnails]="imagenes.length > 1"
      [showIndicators]="false"
      [showItemNavigatorsOnHover]="false">
      <ng-template pTemplate="item" let-item>
        <div class="kb-gallery-img-wrap">
          <img
            [src]="currentImage?.url ?? item.url"
            [alt]="currentImage?.alt || item.alt || 'Prenda Kosta Brava'"
            class="kb-gallery-img"
            loading="eager"
            decoding="async"
            [attr.data-slide]="activeIndex">
        </div>
      </ng-template>
      <ng-template pTemplate="thumbnail" let-item>
        <div class="kb-gallery-thumb-wrap">
          <img
            [src]="item.url"
            [alt]="item.alt || ''"
            class="kb-gallery-thumb"
            loading="lazy"
            decoding="async">
        </div>
      </ng-template>
    </p-galleria>
  </div>

</div>
